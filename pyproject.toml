[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-mcp"
version = "0.5.0"
description = "Local-first multi-source document indexing and MCP retrieval"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "local-rag-mcp contributors"}]
dependencies = [
  "google-api-python-client==2.198.0",
  "google-auth-oauthlib==1.4.0",
  "mcp==2.0.0",
  "openpyxl>=3.1,<4",
  "pdf-inspector==1.15.0",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "watchdog>=4,<7",
]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3,<7"]
dev = ["mypy>=1.11,<2", "pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.5"]

[project.scripts]
local-rag-mcp = "local_rag.cli:entrypoint"
local-rag-mcp-server = "local_rag.mcp:main"
local-rag = "local_rag.cli:legacy_entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
packages = ["local_rag", "local_rag_mcp"]
