[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "phamviet-local-rag-mcp"
version = "0.7.0"
description = "Local-first multi-source document indexing and MCP retrieval"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["mcp", "rag", "local-first", "document-indexing", "retrieval", "fts5"]
authors = [{name = "phamviet86", email = "phamquangviet@bingoenglish.edu.vn"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Natural Language :: English",
  "Natural Language :: Vietnamese",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "mcp==2.0.0",
  "openpyxl>=3.1,<4",
  "pdf-inspector==1.15.0",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "watchdog>=4,<7",
]

[project.urls]
Homepage = "https://github.com/phamviet86/local-rag-mcp"
Documentation = "https://github.com/phamviet86/local-rag-mcp#readme"
Repository = "https://github.com/phamviet86/local-rag-mcp.git"
Issues = "https://github.com/phamviet86/local-rag-mcp/issues"
Changelog = "https://github.com/phamviet86/local-rag-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
google-drive = [
  "google-api-python-client==2.199.0",
  "google-auth-oauthlib==1.4.0",
]
local-embeddings = ["sentence-transformers>=3,<7"]
dev = [
  "build>=1.2,<2",
  "mypy==1.20.2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5",
  "twine>=6,<7",
]

[project.scripts]
local-rag-mcp = "local_rag.cli:entrypoint"
local-rag-mcp-server = "local_rag.mcp:main"
local-rag = "local_rag.cli:legacy_entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_rag = ["py.typed"]
local_rag_mcp = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
packages = ["local_rag", "local_rag_mcp"]
