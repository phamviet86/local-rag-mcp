name: Publish v0.9.0

# One authorized release, from successful CI on the explicitly marked main commit only.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-v0.9.0
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_TAG: v0.9.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify release identity, main head, marker, and immutable tag
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git log -1 --format=%B "$RELEASE_SHA" > "$RUNNER_TEMP/release-message"
          if [ "$version" != "0.9.0" ] || ! grep -Fq '[release v0.9.0]' "$RUNNER_TEMP/release-message"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh auth setup-git --hostname github.com
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          fi
          printf '%s\n' phamviet_local_rag_mcp-0.9.0-py3-none-any.whl phamviet_local_rag_mcp-0.9.0.tar.gz \
            | sort > "$RUNNER_TEMP/expected-payloads"
          { cat "$RUNNER_TEMP/expected-payloads"; printf '%s\n' SHA256SUMS; } \
            | sort > "$RUNNER_TEMP/expected-release-assets"
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-state" 2>/dev/null; then
            if [ "$(cat "$RUNNER_TEMP/release-state")" = "false" ]; then
              test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
              gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
                | sort > "$RUNNER_TEMP/published-release-assets"
              diff "$RUNNER_TEMP/expected-release-assets" "$RUNNER_TEMP/published-release-assets"
              mkdir "$RUNNER_TEMP/published-download"
              gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/published-download"
              awk '{print $2}' "$RUNNER_TEMP/published-download/SHA256SUMS" \
                | sort > "$RUNNER_TEMP/published-checksum-payloads"
              diff "$RUNNER_TEMP/expected-payloads" "$RUNNER_TEMP/published-checksum-payloads"
              (cd "$RUNNER_TEMP/published-download" && sha256sum -c SHA256SUMS)
              python scripts/verify_distribution.py --dist-dir "$RUNNER_TEMP/published-download" --version 0.9.0
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Build and verify fresh release distributions
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$RELEASE_SHA")"
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist
          python -m twine check dist/*
          python scripts/verify_distribution.py --dist-dir dist --version 0.9.0
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Verify installed wheel, skills, and actual MCP retrieval
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/release-wheel"
          "$RUNNER_TEMP/release-wheel/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/release-wheel/bin/pip" check
          executable="$RUNNER_TEMP/release-wheel/bin/local-rag-mcp"
          test "$("$executable" --version)" = "local-rag-mcp 0.9.0"
          "$executable" --home "$RUNNER_TEMP/release-data" setup --no-ocr
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/verify_mcp_stdio.py" \
            --executable "$executable" --home "$RUNNER_TEMP/release-data"
          "$RUNNER_TEMP/release-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/verify_agent_install.py" \
            --executable "$executable"
      - name: Tag exact tested main and publish verified draft assets
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git diff --exit-code
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "local-rag-mcp v0.9.0"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "v0.9.0 — Agent setup skills and workstation onboarding" \
              --notes-file docs/releases/v0.9.0.md
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = "true"
          gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            | sort > "$RUNNER_TEMP/draft-release-assets"
          diff "$RUNNER_TEMP/expected-release-assets" "$RUNNER_TEMP/draft-release-assets"
          mkdir "$RUNNER_TEMP/release-download"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-download"
          awk '{print $2}' "$RUNNER_TEMP/release-download/SHA256SUMS" \
            | sort > "$RUNNER_TEMP/draft-checksum-payloads"
          diff "$RUNNER_TEMP/expected-payloads" "$RUNNER_TEMP/draft-checksum-payloads"
          (cd "$RUNNER_TEMP/release-download" && sha256sum -c SHA256SUMS)
          diff dist/SHA256SUMS "$RUNNER_TEMP/release-download/SHA256SUMS"
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          gh release edit "$RELEASE_TAG" --draft=false --latest
