name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest
      - run: |
          local-rag-mcp --help
          local-rag-mcp mcp --help
          local-rag --help
      - name: Wheel and isolated CLI smoke
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv /tmp/local-rag-mcp-wheel
          /tmp/local-rag-mcp-wheel/bin/pip install dist/*.whl
          /tmp/local-rag-mcp-wheel/bin/pip check
          /tmp/local-rag-mcp-wheel/bin/python -c "import mcp, pdf_inspector, watchdog"
          data_root=$(mktemp -d)
          /tmp/local-rag-mcp-wheel/bin/local-rag-mcp --home "$data_root" setup --no-ocr
          if /tmp/local-rag-mcp-wheel/bin/local-rag-mcp --home "$data_root" doctor --json; then
            echo "doctor unexpectedly reported ready with zero sources"
            exit 1
          fi
