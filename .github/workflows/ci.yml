name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: python -m compileall -q src tests scripts
      - run: pytest
      - name: Check development console scripts
        run: |
          local-rag-mcp --version
          local-rag-mcp --help
          local-rag-mcp mcp --help
          local-rag --help

  release-package:
    name: Release package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - name: Build wheel and source distribution
        run: python -m build --outdir dist
      - name: Validate package metadata and rendered README
        run: python -m twine check dist/*
      - name: Verify release artifact contents
        run: >-
          python scripts/verify_distribution.py --dist-dir dist
          --distribution phamviet-local-rag-mcp --version 0.7.0
      - name: Install wheel in a fresh virtual environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/local-rag-mcp-wheel"
          "$RUNNER_TEMP/local-rag-mcp-wheel/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/local-rag-mcp-wheel/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/local-rag-mcp-wheel/bin/pip" check
          test "$("$RUNNER_TEMP/local-rag-mcp-wheel/bin/local-rag-mcp" --version)" = "local-rag-mcp 0.7.0"
          "$RUNNER_TEMP/local-rag-mcp-wheel/bin/local-rag-mcp" --help >/dev/null
          "$RUNNER_TEMP/local-rag-mcp-wheel/bin/local-rag-mcp" mcp --help >/dev/null
      - name: Verify fresh no-OCR and zero-source behavior
        shell: bash
        run: |
          data_root="$RUNNER_TEMP/local-rag-mcp-data"
          executable="$RUNNER_TEMP/local-rag-mcp-wheel/bin/local-rag-mcp"
          "$executable" --home "$data_root" setup --no-ocr
          set +e
          "$executable" --home "$data_root" status
          status_code=$?
          set -e
          test "$status_code" -eq 2
          "$executable" --home "$data_root" jobs list
          "$executable" --home "$data_root" service status
          set +e
          "$executable" --home "$data_root" doctor --json
          doctor_code=$?
          set -e
          test "$doctor_code" -eq 2
      - name: Verify installed MCP stdio server
        shell: bash
        run: >-
          "$RUNNER_TEMP/local-rag-mcp-wheel/bin/python" scripts/verify_mcp_stdio.py
          --executable "$RUNNER_TEMP/local-rag-mcp-wheel/bin/local-rag-mcp"
          --home "$RUNNER_TEMP/local-rag-mcp-data"
