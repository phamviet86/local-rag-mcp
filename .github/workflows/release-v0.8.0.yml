name: Publish v0.8.0

# One release only: later versions require their own explicit publication decision.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-v0.8.0
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_TAG: v0.8.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify release identity and avoid duplicate publication
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if [ "$version" != "0.8.0" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-state" 2>/dev/null; then
            if [ "$(cat "$RUNNER_TEMP/release-state")" = "false" ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Build and verify fresh release distributions
        if: steps.gate.outputs.publish == 'true'
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist
          python -m twine check dist/*
          python scripts/verify_distribution.py --dist-dir dist --version 0.8.0
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Verify wheel installation and MCP boundary
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/release-wheel"
          "$RUNNER_TEMP/release-wheel/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/release-wheel/bin/pip" check
          executable="$RUNNER_TEMP/release-wheel/bin/local-rag-mcp"
          test "$("$executable" --version)" = "local-rag-mcp 0.8.0"
          "$executable" --home "$RUNNER_TEMP/release-data" setup --no-ocr
          python scripts/verify_mcp_stdio.py --executable "$executable" --home "$RUNNER_TEMP/release-data"
      - name: Tag exact tested main and publish verified assets
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "local-rag-mcp v0.8.0"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "v0.8.0 — Reliable Drive indexing and search coverage" \
              --notes-file docs/releases/v0.8.0.md
          fi
          gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS --clobber
          mkdir "$RUNNER_TEMP/release-download"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-download"
          (cd "$RUNNER_TEMP/release-download" && sha256sum -c SHA256SUMS)
          diff dist/SHA256SUMS "$RUNNER_TEMP/release-download/SHA256SUMS"
          gh release edit "$RELEASE_TAG" --draft=false --latest
